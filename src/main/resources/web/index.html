<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TerraPreview</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html, body {
    height: 100%;
    margin: 0;
}
#map {
    height: 100%;
}
#map img {
    image-rendering: pixelated;
}
#coords-bar {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    border-radius: 0 0 6px 6px;
    pointer-events: none;
    white-space: nowrap;
}
#coords-bar svg {
    width: 14px;
    height: 14px;
    vertical-align: -2px;
    margin-right: 4px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.2;
}
.coord-seg {
    margin: 0 18px;
}
#offline-banner {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1001;
    padding: 10px 16px;
    background: rgba(140, 20, 20, 0.92);
    color: #fff;
    font-family: monospace;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #f88;
    display: none;
}
#error-banner {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1001;
    max-width: 80%;
    padding: 10px 16px;
    background: rgba(140, 20, 20, 0.92);
    color: #fff;
    font-family: monospace;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #f88;
    display: none;
}
.copy-button {
    margin-left: 6px;
    padding: 0;
    border: none;
    background: none;
    color: inherit;
    opacity: 0.4;
    cursor: pointer;
    pointer-events: auto;
    vertical-align: -2px;
}
.copy-button:hover,
.copy-button.copied {
    opacity: 1;
}
.copy-button svg {
    width: 12px;
    height: 12px;
}
#coords-bar,
.leaflet-container .leaflet-control-attribution {
    padding: 4px 12px;
    background: rgba(38, 38, 38, 0.8);
    color: #eee;
    font-family: monospace;
    font-size: 14px;
}
.leaflet-container .leaflet-control-attribution {
    border-radius: 6px 0 0 0;
}
.leaflet-container .leaflet-control-attribution a {
    color: #9cf;
}
</style>
</head>
<body>
<div id="map"></div>
<div id="offline-banner">Server offline &mdash; waiting for it to come back&hellip;</div>
<div id="error-banner"></div>
<div id="coords-bar"><span class="coord-seg"><svg viewBox="0 0 16 16"><path d="M8 1.5 14 4.5v7L8 14.5 2 11.5v-7z"/><path d="M2 4.5 8 7.5l6-3"/><path d="M8 7.5v7"/></svg><span id="block-coords"></span><button class="copy-button" data-copy="block-coords" title="Copy coordinates"><svg viewBox="0 0 16 16"><rect x="5" y="5" width="9" height="9" rx="1"/><path d="M11 5V2.5a.5.5 0 0 0-.5-.5H2.5a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 .5.5H5"/></svg></button></span><span class="coord-seg"><svg viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l4.5 4.5"/></svg><span id="zoom-coords"></span><button class="copy-button" data-copy="zoom-coords" title="Copy zoom level"><svg viewBox="0 0 16 16"><rect x="5" y="5" width="9" height="9" rx="1"/><path d="M11 5V2.5a.5.5 0 0 0-.5-.5H2.5a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 .5.5H5"/></svg></button></span><span class="coord-seg"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><ellipse cx="8" cy="8" rx="3" ry="6.5"/><path d="M1.5 8h13"/></svg><span id="geo-coords"></span><button class="copy-button" data-copy="geo-coords" title="Copy coordinates"><svg viewBox="0 0 16 16"><rect x="5" y="5" width="9" height="9" rx="1"/><path d="M11 5V2.5a.5.5 0 0 0-.5-.5H2.5a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 .5.5H5"/></svg></button></span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TILE_SIZE = @TILE_SIZE@;
const BLOCKS_PER_UNIT = @CHUNK_SIZE@ / TILE_SIZE;
const crs = L.Util.extend({}, L.CRS.Simple, {
    transformation: new L.Transformation(1, 0, 1, 0),
});
const map = L.map('map', {
    crs: crs,
    minZoom: @MIN_ZOOM@,
    maxZoom: @MAX_ZOOM@,
    zoomControl: false,
    attributionControl: true,
});
let tileVersion = 0;
const makeTiles = () => {
    const layer = L.gridLayer({
        tileSize: TILE_SIZE,
        minZoom: @MIN_ZOOM@,
        maxZoom: @MAX_ZOOM@,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        keepBuffer: 0,
        updateWhenIdle: true,
    });
    layer.createTile = (coords) => {
        const tile = document.createElement('img');
        tile.src = '/tiles/' + coords.z + '/' + coords.x + '/' + coords.y + '.png?v=' + tileVersion;
        return tile;
    };
    return layer;
};
const tileLayers = [makeTiles()];
tileLayers[0].addTo(map);
const errorBanner = document.getElementById('error-banner');
const showError = (message) => {
    if (message === null) {
        errorBanner.style.display = 'none';
        errorBanner.textContent = '';
    } else {
        errorBanner.textContent = message;
        errorBanner.style.display = 'block';
    }
};
const refreshError = () => {
    fetch('/error')
        .then((response) => response.json())
        .then(showError);
};
refreshError();
const offlineBanner = document.getElementById('offline-banner');
const events = new EventSource('/events');
events.onopen = () => {
    offlineBanner.style.display = 'none';
};
events.onerror = () => {
    offlineBanner.style.display = 'block';
};
events.addEventListener('hello', (event) => {
    if (window.serverInstanceId === undefined) {
        window.serverInstanceId = event.data;
    } else if (window.serverInstanceId !== event.data) {
        location.reload();
    }
});
events.onmessage = (event) => {
    tileVersion = event.data;
    refreshError();
    const layer = makeTiles();
    layer.addTo(map);
    tileLayers.push(layer);
    while (tileLayers.length > 2) {
        map.removeLayer(tileLayers.shift());
    }
};
document.querySelectorAll('#coords-bar .copy-button').forEach((button) => {
    button.addEventListener('click', () => {
        const text = document.getElementById(button.dataset.copy).textContent;
        navigator.clipboard.writeText(text);
        button.classList.add('copied');
        setTimeout(() => button.classList.remove('copied'), 500);
    });
});
const blockCoords = document.getElementById('block-coords');
const zoomCoords = document.getElementById('zoom-coords');
const geoCoords = document.getElementById('geo-coords');
const PLACEHOLDER = '--';
const GEO_MIN_INTERVAL_MILLIS = 1000;
let geoBlockX = null;
let geoBlockZ = null;
let geoBusy = false;
let geoStale = false;
let geoTimer = null;
let geoLastRequestAt = 0;
const renderGeo = (latitude, longitude) => {
    geoCoords.textContent = latitude + '°, ' + longitude + '°';
};
const updateGeo = () => {
    if (geoBlockX === null || geoBusy) {
        geoStale = true;
        return;
    }
    const wait = geoLastRequestAt + GEO_MIN_INTERVAL_MILLIS - Date.now();
    if (wait > 0) {
        geoStale = true;
        clearTimeout(geoTimer);
        geoTimer = setTimeout(updateGeo, wait);
        return;
    }
    geoStale = false;
    geoBusy = true;
    geoLastRequestAt = Date.now();
    const x = geoBlockX;
    const z = geoBlockZ;
    fetch('/geo/' + x + '/' + z)
        .then((response) => (response.ok ? response.json() : Promise.reject()))
        .then((geo) => renderGeo(geo.latitude.toFixed(4), geo.longitude.toFixed(4)), () =>
            renderGeo(PLACEHOLDER, PLACEHOLDER))
        .then(() => {
            geoBusy = false;
            if (geoStale && (x !== geoBlockX || z !== geoBlockZ)) {
                updateGeo();
            }
        });
};
const showCoords = (latlng) => {
    const blockX = Math.floor(latlng.lng * BLOCKS_PER_UNIT);
    const blockZ = Math.floor(latlng.lat * BLOCKS_PER_UNIT);
    blockCoords.textContent = blockX + ', ' + blockZ;
    zoomCoords.textContent = map.getZoom();
    if (blockX !== geoBlockX || blockZ !== geoBlockZ) {
        geoBlockX = blockX;
        geoBlockZ = blockZ;
        updateGeo();
    }
};
renderGeo(PLACEHOLDER, PLACEHOLDER);
const showCenter = () => showCoords(map.getCenter());
let pointerLatLng = null;
map.on('mousemove', (event) => {
    pointerLatLng = event.latlng;
    showCoords(pointerLatLng);
});
map.on('mouseout', () => {
    pointerLatLng = null;
    showCenter();
});
map.on('move zoom moveend zoomend', () => {
    if (pointerLatLng === null) {
        showCenter();
    } else {
        showCoords(pointerLatLng);
    }
    updateUrl();
});
const updateUrl = () => {
    const center = map.getCenter();
    const x = center.lng * BLOCKS_PER_UNIT;
    const z = center.lat * BLOCKS_PER_UNIT;
    const hash = '#' + x.toFixed(3) + ',' + z.toFixed(3) + ',' + map.getZoom();
    history.replaceState(null, '', hash);
};
const initialView = /^#(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)$/.exec(location.hash);
if (initialView) {
    map.setView([Number(initialView[2]) / BLOCKS_PER_UNIT, Number(initialView[1]) / BLOCKS_PER_UNIT], Number(initialView[3]));
} else {
    map.setView([@CENTER_LAT@, @CENTER_LNG@], @MAX_ZOOM@);
}
showCenter();
</script>
</body>
</html>
