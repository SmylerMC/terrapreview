<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TerraPreview</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html, body {
    height: 100%;
    margin: 0;
}
#map {
    height: 100%;
}
#map img {
    image-rendering: pixelated;
}
#coords-bar {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    border-radius: 0 0 6px 6px;
    pointer-events: none;
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: center;
}
#loading-indicator {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 1000;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(38, 38, 38, 0.8);
    border-top-color: #eee;
    border-radius: 50%;
    animation: loading-spin 0.8s linear infinite;
    display: none;
    pointer-events: none;
}
@keyframes loading-spin {
    to { transform: rotate(360deg); }
}
#coords-bar svg {
    width: 14px;
    height: 14px;
    vertical-align: -2px;
    margin-right: 4px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.2;
}
.coord-seg {
    margin: 0 18px;
}
#offline-banner {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1001;
    padding: 10px 16px;
    background: rgba(140, 20, 20, 0.92);
    color: #fff;
    font-family: monospace;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #f88;
    display: none;
}
#error-banner {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1001;
    max-width: 80%;
    padding: 10px 16px;
    background: rgba(140, 20, 20, 0.92);
    color: #fff;
    font-family: monospace;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #f88;
    display: none;
}
.copy-button {
    margin-left: 6px;
    padding: 0;
    border: none;
    background: none;
    color: inherit;
    opacity: 0.4;
    cursor: pointer;
    pointer-events: auto;
    vertical-align: -2px;
}
.copy-button:hover,
.copy-button.copied {
    opacity: 1;
}
.copy-button svg {
    width: 12px;
    height: 12px;
}
#search-seg {
    position: relative;
    pointer-events: auto;
}
#search-input {
    box-sizing: border-box;
    width: 200px;
    padding: 0;
    border: none;
    background: none;
    color: #eee;
    font-family: inherit;
    font-size: inherit;
    outline: none;
}
#search-input::placeholder {
    color: #999;
}
#search-results {
    position: absolute;
    top: 100%;
    left: 0;
    margin: 0;
    padding: 0;
    list-style: none;
    width: 300px;
    max-height: 320px;
    overflow-y: auto;
    border-radius: 0 0 6px 6px;
    background: rgba(38, 38, 38, 0.9);
    color: #eee;
    text-align: left;
}
#search-results.hidden {
    display: none;
}
#search-results li {
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
#search-results li:hover {
    background: rgba(255, 255, 255, 0.15);
}
#search-results li .search-kind {
    margin-left: 6px;
    color: #999;
}
#search-results li .search-kind::before {
    content: '·';
    margin-right: 6px;
}
#coords-bar,
.leaflet-container .leaflet-control-attribution {
    padding: 4px 12px;
    background: rgba(38, 38, 38, 0.8);
    color: #eee;
    font-family: monospace;
    font-size: 14px;
}
.leaflet-container .leaflet-control-attribution {
    border-radius: 6px 0 0 0;
}
.leaflet-container .leaflet-control-attribution a {
    color: #9cf;
}
</style>
</head>
<body>
<div id="map"></div>
<div id="offline-banner">Server offline &mdash; waiting for it to come back&hellip;</div>
<div id="loading-indicator"></div>
<div id="error-banner"></div>
<div id="coords-bar"><span class="coord-seg"><svg viewBox="0 0 16 16"><path d="M8 1.5 14 4.5v7L8 14.5 2 11.5v-7z"/><path d="M2 4.5 8 7.5l6-3"/><path d="M8 7.5v7"/></svg><span id="block-coords"></span><button class="copy-button" data-copy="block-coords" title="Copy coordinates"><svg viewBox="0 0 16 16"><rect x="5" y="5" width="9" height="9" rx="1"/><path d="M11 5V2.5a.5.5 0 0 0-.5-.5H2.5a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 .5.5H5"/></svg></button></span><span class="coord-seg"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><ellipse cx="8" cy="8" rx="3" ry="6.5"/><path d="M1.5 8h13"/></svg><span id="geo-coords"></span><button class="copy-button" data-copy="geo-coords" title="Copy coordinates"><svg viewBox="0 0 16 16"><rect x="5" y="5" width="9" height="9" rx="1"/><path d="M11 5V2.5a.5.5 0 0 0-.5-.5H2.5a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 .5.5H5"/></svg></button></span><span class="coord-seg" id="search-seg"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3.5 3.5"/></svg><input id="search-input" type="text" placeholder="Search a place…" autocomplete="off"><ul id="search-results" class="hidden"></ul></span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TILE_SIZE = @TILE_SIZE@;
const BLOCKS_PER_UNIT = @CHUNK_SIZE@ / TILE_SIZE;
const crs = L.Util.extend({}, L.CRS.Simple, {
    transformation: new L.Transformation(1, 0, 1, 0),
});
const map = L.map('map', {
    crs: crs,
    minZoom: @MIN_ZOOM@,
    maxZoom: @MAX_ZOOM@,
    zoomControl: false,
    attributionControl: true,
});
let tileVersion = 0;
const loadingIndicator = document.getElementById('loading-indicator');
let pendingTiles = 0;
let pendingGeoRequests = 0;
const updateLoadingIndicator = () => {
    loadingIndicator.style.display = pendingTiles + pendingGeoRequests > 0 ? 'block' : 'none';
};
const makeTiles = () => {
    const layer = L.gridLayer({
        tileSize: TILE_SIZE,
        minZoom: @MIN_ZOOM@,
        maxZoom: @MAX_ZOOM@,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        keepBuffer: 0,
        updateWhenIdle: true,
    });
    layer.createTile = (coords, done) => {
        const tile = document.createElement('img');
        pendingTiles++;
        updateLoadingIndicator();
        tile.onload = () => {
            pendingTiles--;
            updateLoadingIndicator();
            done(null, tile);
        };
        tile.onerror = () => {
            pendingTiles--;
            updateLoadingIndicator();
            done('error', tile);
        };
        tile.src = '/tiles/' + coords.z + '/' + coords.x + '/' + coords.y + '.png?v=' + tileVersion;
        return tile;
    };
    return layer;
};
const tileLayers = [makeTiles()];
tileLayers[0].addTo(map);
const errorBanner = document.getElementById('error-banner');
const showError = (message) => {
    if (message === null) {
        errorBanner.style.display = 'none';
        errorBanner.textContent = '';
    } else {
        errorBanner.textContent = message;
        errorBanner.style.display = 'block';
    }
};
const refreshError = () => {
    fetch('/error')
        .then((response) => response.json())
        .then(showError);
};
refreshError();
const offlineBanner = document.getElementById('offline-banner');
const events = new EventSource('/events');
events.onopen = () => {
    offlineBanner.style.display = 'none';
};
events.onerror = () => {
    offlineBanner.style.display = 'block';
};
events.addEventListener('hello', (event) => {
    if (window.serverInstanceId === undefined) {
        window.serverInstanceId = event.data;
    } else if (window.serverInstanceId !== event.data) {
        location.reload();
    }
});
events.onmessage = (event) => {
    tileVersion = event.data;
    refreshError();
    const layer = makeTiles();
    layer.addTo(map);
    tileLayers.push(layer);
    while (tileLayers.length > 2) {
        map.removeLayer(tileLayers.shift());
    }
};
document.querySelectorAll('#coords-bar .copy-button').forEach((button) => {
    button.addEventListener('click', () => {
        const text = document.getElementById(button.dataset.copy).textContent;
        navigator.clipboard.writeText(text);
        button.classList.add('copied');
        setTimeout(() => button.classList.remove('copied'), 500);
    });
});
const blockCoords = document.getElementById('block-coords');
const geoCoords = document.getElementById('geo-coords');
const PLACEHOLDER = '--';
const GEO_MIN_INTERVAL_MILLIS = 1000;
let geoBlockX = null;
let geoBlockZ = null;
let geoBusy = false;
let geoStale = false;
let geoTimer = null;
let geoLastRequestAt = 0;
const renderGeo = (latitude, longitude) => {
    geoCoords.textContent = latitude + '°, ' + longitude + '°';
};
const updateGeo = () => {
    if (geoBlockX === null || geoBusy) {
        geoStale = true;
        return;
    }
    const wait = geoLastRequestAt + GEO_MIN_INTERVAL_MILLIS - Date.now();
    if (wait > 0) {
        geoStale = true;
        clearTimeout(geoTimer);
        geoTimer = setTimeout(updateGeo, wait);
        return;
    }
    geoStale = false;
    geoBusy = true;
    geoLastRequestAt = Date.now();
    const x = geoBlockX;
    const z = geoBlockZ;
    pendingGeoRequests++;
    updateLoadingIndicator();
    fetch('/geo/' + x + '/' + z)
        .then((response) => (response.ok ? response.json() : Promise.reject()))
        .then((geo) => renderGeo(geo.latitude.toFixed(4), geo.longitude.toFixed(4)), () =>
            renderGeo(PLACEHOLDER, PLACEHOLDER))
        .finally(() => {
            pendingGeoRequests--;
            updateLoadingIndicator();
            geoBusy = false;
            if (geoStale && (x !== geoBlockX || z !== geoBlockZ)) {
                updateGeo();
            }
        });
};
const showCoords = (latlng) => {
    const blockX = Math.floor(latlng.lng * BLOCKS_PER_UNIT);
    const blockZ = Math.floor(latlng.lat * BLOCKS_PER_UNIT);
    blockCoords.textContent = blockX + ', ' + blockZ;
    if (blockX !== geoBlockX || blockZ !== geoBlockZ) {
        geoBlockX = blockX;
        geoBlockZ = blockZ;
        updateGeo();
    }
};
renderGeo(PLACEHOLDER, PLACEHOLDER);
const showCenter = () => showCoords(map.getCenter());
let pointerLatLng = null;
map.on('mousemove', (event) => {
    pointerLatLng = event.latlng;
    showCoords(pointerLatLng);
});
map.on('mouseout', () => {
    pointerLatLng = null;
    showCenter();
});
map.on('move zoom moveend zoomend', () => {
    if (pointerLatLng === null) {
        showCenter();
    } else {
        showCoords(pointerLatLng);
    }
    updateUrl();
});
const updateUrl = () => {
    const center = map.getCenter();
    const x = center.lng * BLOCKS_PER_UNIT;
    const z = center.lat * BLOCKS_PER_UNIT;
    const hash = '#' + x.toFixed(3) + ',' + z.toFixed(3) + ',' + map.getZoom();
    history.replaceState(null, '', hash);
};
const initialView = /^#(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)$/.exec(location.hash);
if (initialView) {
    map.setView([Number(initialView[2]) / BLOCKS_PER_UNIT, Number(initialView[1]) / BLOCKS_PER_UNIT], Number(initialView[3]));
} else {
    map.setView([@CENTER_LAT@, @CENTER_LNG@], @MAX_ZOOM@);
}
const GEOCODER_NAME = '@GEOCODER_NAME@';
const GEOCODER_URL = '@GEOCODER_URL@';
const SEARCH_DEBOUNCE_MILLIS = 250;
const SEARCH_URL = GEOCODER_URL + '/api/?limit=5&osm_tag=place&q=';
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
const SEARCH_ATTRIBUTION = 'Search by <a href="' + GEOCODER_URL + '">' + GEOCODER_NAME + '</a>';
let searchVersion = 0;
let searchTimer = null;
let searchMarker = null;
const titleOfPlace = (place) =>
    place.properties.name || place.properties.street || place.properties.city ||
    place.properties.county || place.properties.state || place.properties.country || 'Unnamed place';
const descriptionOfPlace = (place) =>
    [place.properties.city, place.properties.county, place.properties.state, place.properties.country]
        .filter((part) => part && part !== place.properties.name)
        .filter((part, index, parts) => parts.indexOf(part) === index)
        .join(', ');
const kindOfPlace = (place) => place.properties.osm_value || '';
const renderResults = (places) => {
    searchResults.textContent = '';
    if (places.length === 0) {
        searchResults.classList.add('hidden');
        return;
    }
    for (const place of places) {
        const item = document.createElement('li');
        item.dataset.lon = place.geometry.coordinates[0];
        item.dataset.lat = place.geometry.coordinates[1];
        item.textContent = titleOfPlace(place);
        const description = descriptionOfPlace(place);
        if (description) {
            item.textContent += ' (' + description + ')';
        }
        const kind = kindOfPlace(place);
        if (kind) {
            const kindSpan = document.createElement('span');
            kindSpan.className = 'search-kind';
            kindSpan.textContent = kind.replaceAll('_', ' ');
            item.appendChild(kindSpan);
        }
        searchResults.appendChild(item);
    }
    searchResults.classList.remove('hidden');
};
const search = () => {
    const query = searchInput.value.trim();
    if (query.length < 2) {
        searchVersion++;
        renderResults([]);
        return;
    }
    const version = ++searchVersion;
    fetch(SEARCH_URL + encodeURIComponent(query))
        .then((response) => (response.ok ? response.json() : Promise.reject()))
        .then((body) => {
            if (version === searchVersion) {
                renderResults(body.features || []);
            }
        }, () => {});
};
searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(search, SEARCH_DEBOUNCE_MILLIS);
});
searchResults.addEventListener('mousedown', (event) => {
    const item = event.target.closest('li');
    if (!item) {
        return;
    }
    const longitude = Number(item.dataset.lon);
    const latitude = Number(item.dataset.lat);
    fetch('/locate/' + longitude + '/' + latitude)
        .then((response) => (response.ok ? response.json() : Promise.reject()))
        .then((block) => {
            searchResults.classList.add('hidden');
            map.attributionControl.addAttribution(SEARCH_ATTRIBUTION);
            if (searchMarker) {
                map.removeLayer(searchMarker);
            }
            searchMarker = L.circleMarker([block.z / BLOCKS_PER_UNIT, block.x / BLOCKS_PER_UNIT], {
                radius: 10,
                color: '#fff',
                weight: 2,
                fillColor: '#e33',
                fillOpacity: 0.9,
            }).addTo(map);
            map.setView([block.z / BLOCKS_PER_UNIT, block.x / BLOCKS_PER_UNIT], @MAX_ZOOM@);
        }, () => {
            searchResults.textContent = '';
            const message = document.createElement('li');
            message.textContent = 'This place is outside the projection bounds';
            searchResults.classList.remove('hidden');
        });
});
document.addEventListener('click', (event) => {
    if (!event.target.closest('#search-seg')) {
        searchResults.classList.add('hidden');
    }
});
searchInput.addEventListener('focus', () => {
    if (searchResults.children.length > 0) {
        searchResults.classList.remove('hidden');
    }
});
searchInput.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
        searchResults.classList.add('hidden');
    }
});
showCenter();
</script>
</body>
</html>
